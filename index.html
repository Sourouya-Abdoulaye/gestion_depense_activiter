<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mon Commerce — Gestion commerciale et financière</title>
    <meta
      name="description"
      content="Mon Commerce : application de gestion des achats, ventes, stock, dépenses, trésorerie et rentabilité pour les petits commerçants. Français, FCFA, hors ligne."
    />
    <meta name="theme-color" content="#15803D" />
    <meta name="color-scheme" content="light" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mon Commerce" />
  </head>
  <body>
    <a
      href="#view"
      class="sr-only focus:not-sr-only focus:absolute focus:left-3 focus:top-3 focus:z-50 focus:rounded-lg focus:bg-brand focus:px-3 focus:py-2 focus:text-white"
      >Aller au contenu principal</a
    >

    <div id="app" class="min-h-screen">
      <!-- Bandeau d'état (hors ligne / stockage) -->
      <div id="status-bar" class="hidden items-center justify-center gap-2 px-3 py-1.5 text-xs font-medium"></div>

      <div class="flex min-h-screen flex-col">
        <!-- Barre supérieure -->
        <header
          class="no-print sticky top-0 z-30 flex items-center gap-3 border-b border-line bg-white px-3 py-2.5 sm:px-4"
        >
          <button
            id="nav-toggle"
            type="button"
            class="btn-ghost btn-sm lg:hidden"
            aria-expanded="false"
            aria-controls="sidebar"
            aria-label="Ouvrir le menu de navigation"
          >
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" />
            </svg>
            Menu
          </button>

          <a href="#/tableau-de-bord" class="flex min-w-0 items-center gap-2.5">
            <span
              class="grid h-9 w-9 shrink-0 place-items-center rounded-lg bg-brand text-sm font-bold text-white"
              aria-hidden="true"
              >MC</span
            >
            <span class="min-w-0">
              <span class="block truncate text-sm font-bold leading-tight text-brand-dark">Mon Commerce</span>
              <span id="shop-name-top" class="block truncate text-xs leading-tight text-muted">Gestion commerciale</span>
            </span>
          </a>

          <div class="ml-auto flex items-center gap-2">
            <span id="net-status" class="badge badge-neutral" title="État de la connexion">
              <span class="h-1.5 w-1.5 rounded-full bg-muted"></span>
              <span data-role="net-label">—</span>
            </span>
            <button id="quick-sale" type="button" class="btn-primary btn-sm">
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M5 12h14" stroke-linecap="round" />
              </svg>
              <span class="hidden sm:inline">Nouvelle vente</span>
              <span class="sm:hidden">Vente</span>
            </button>
          </div>
        </header>

        <div class="mx-auto flex w-full max-w-[1500px] flex-1 items-stretch">
          <!-- Navigation latérale -->
          <aside
            id="sidebar"
            class="no-print fixed inset-y-0 left-0 z-40 w-72 -translate-x-full overflow-y-auto border-r border-line bg-white transition-transform duration-200 lg:sticky lg:top-[57px] lg:h-[calc(100vh-57px)] lg:w-64 lg:translate-x-0"
            aria-label="Navigation principale"
          >
            <nav class="scroll-thin flex h-full flex-col gap-1 p-3">
              <div id="activity-switcher" class="mb-2"></div>
              <div id="nav-items" class="flex flex-1 flex-col gap-0.5"></div>
              <div class="mt-2 border-t border-line pt-3 text-xs text-muted">
                <p id="sidebar-activity-summary"></p>
                <p class="mt-2">
                  Version <span id="app-version">—</span> — données locales
                </p>
              </div>
            </nav>
          </aside>
          <div id="nav-backdrop" class="no-print fixed inset-0 z-30 hidden bg-ink/40 lg:hidden"></div>

          <!-- Contenu -->
          <main id="view" tabindex="-1" class="min-w-0 flex-1 px-3 py-4 sm:px-5 sm:py-6"></main>
        </div>

        <!-- Navigation mobile compacte -->
        <nav
          id="mobile-nav"
          class="no-print sticky bottom-0 z-30 grid grid-cols-5 gap-1 border-t border-line bg-white px-1 py-1 lg:hidden"
          aria-label="Navigation rapide"
        ></nav>
      </div>
    </div>

    <div id="modal-root" hidden></div>
    <div id="toast-root" class="no-print pointer-events-none fixed inset-x-0 top-3 z-50 flex flex-col items-center gap-2 px-3" aria-live="polite" aria-atomic="false"></div>

    <noscript>
      <div style="padding: 16px; font-family: sans-serif">
        Mon Commerce nécessite JavaScript pour fonctionner. Activez JavaScript puis rechargez la page.
      </div>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
